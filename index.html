<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Org Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <style>
      :root {
        --page: #dcdad6;
        --frame: #111;
        --bg: #efede8;
        --card: #f6f5f1;
        --ink: #1c1b19;
        --muted: #77746d;
        --line: #e2dfd8;
        --accent: #f5875e;
        --accent-ink: #fff;
        --chip: #e9e6df;
        --bar: #d6d3cd;
        --ok: #2f8a55;
        --warn: #b07a12;
        --bad: #c2412f;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      :root[data-theme="dark"] {
        --page: #0c0c0b;
        --frame: #000;
        --bg: #1a1917;
        --card: #22211e;
        --ink: #efede8;
        --muted: #9d9a92;
        --line: #2f2d29;
        --chip: #2c2a26;
        --bar: #3a3833;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #0c0c0b;
          --frame: #000;
          --bg: #1a1917;
          --card: #22211e;
          --ink: #efede8;
          --muted: #9d9a92;
          --line: #2f2d29;
          --chip: #2c2a26;
          --bar: #3a3833;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 Poppins,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .app {
        max-width: 1400px;
        margin: 0 auto;
        padding: 22px 26px 30px;
        min-height: 100vh;
      }
      @media (max-width: 760px) {
        .app {
          padding: 16px;
        }
      }

      /* top bar */
      .top {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 20px;
      }
      .logo i {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid var(--accent);
        display: grid;
        place-items: center;
      }
      .logo i::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .nav {
        margin: 0 auto;
        display: flex;
        gap: 6px;
        background: var(--card);
        padding: 5px;
        border-radius: 99px;
        border: 1px solid var(--line);
        overflow-x: auto;
        max-width: 100%;
      }
      .nav button {
        border: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        padding: 8px 18px;
        border-radius: 99px;
        cursor: pointer;
        white-space: nowrap;
      }
      .nav button:hover {
        background: var(--chip);
      }
      .nav button[aria-current="page"] {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .round {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        display: grid;
        place-items: center;
        cursor: pointer;
        font: inherit;
      }
      .round[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .me {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #2b2a27;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 600;
      }

      /* welcome */
      .welcome {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 26px 0 20px;
        flex-wrap: wrap;
      }
      .welcome h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      .welcome p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .cta {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 99px;
        padding: 11px 22px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .cta:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .cta.ghost {
        background: var(--chip);
        color: var(--ink);
      }

      /* cards */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .card h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 500;
      }
      .card .hint {
        color: var(--muted);
        font-size: 12px;
      }
      .chead {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
        margin-bottom: 14px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .kpi {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .kpi .t {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
      }
      .kpi .ic {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--chip);
        display: grid;
        place-items: center;
      }
      .kpi .arrow {
        margin-left: auto;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        font-size: 12px;
      }
      .kpi .v {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 8px;
        flex-wrap: wrap;
      }
      .kpi b {
        font-size: 32px;
        font-weight: 600;
        line-height: 1;
      }
      .kpi small {
        color: var(--muted);
        font-size: 12px;
      }
      .kpi.hot {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .kpi.hot .ic,
      .kpi.hot .arrow {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.3);
      }
      .kpi.hot small {
        color: rgba(255, 255, 255, 0.85);
      }

      .row {
        display: grid;
        gap: 16px;
        margin-top: 16px;
      }
      .r2 {
        grid-template-columns: 1.75fr 1fr;
      }
      .r3 {
        grid-template-columns: 1fr 1.75fr;
      }
      @media (max-width: 1000px) {
        .kpis {
          grid-template-columns: repeat(2, 1fr);
        }
        .r2,
        .r3 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 520px) {
        .kpis {
          grid-template-columns: 1fr;
        }
      }

      /* bar chart */
      .big {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .big b {
        font-size: 30px;
        font-weight: 600;
      }
      .pill {
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--chip);
        color: var(--muted);
      }
      .pill.good {
        background: rgba(47, 138, 85, 0.12);
        color: var(--ok);
      }
      .legend {
        display: flex;
        gap: 18px;
        color: var(--muted);
        font-size: 13px;
        flex-wrap: wrap;
      }
      .legend span::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bar);
        margin-right: 6px;
      }
      .legend span.a::before {
        background: var(--accent);
      }
      .chart {
        position: relative;
        height: 240px;
        margin-top: 18px;
        display: grid;
        grid-template-columns: 38px 1fr;
      }
      .yax {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
        padding-bottom: 22px;
      }
      .plot {
        position: relative;
        display: flex;
        align-items: end;
        gap: 3%;
        padding: 0 1% 22px;
        background: repeating-linear-gradient(
          to top,
          transparent 0 calc(20% - 1px),
          var(--line) calc(20% - 1px) 20%
        );
        background-size: 100% calc(100% - 22px);
        background-repeat: no-repeat;
      }
      .bar {
        flex: 1;
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: end;
        cursor: pointer;
        border: 0;
        background: none;
        padding: 0;
        font: inherit;
        color: inherit;
      }
      .bar i {
        display: block;
        border-radius: 6px 6px 3px 3px;
        background: repeating-linear-gradient(
          135deg,
          var(--bar) 0 2px,
          color-mix(in srgb, var(--bar) 75%, var(--card)) 2px 4px
        );
        transition: background 0.2s;
        min-height: 6px;
      }
      .bar.on i,
      .bar:hover i {
        background: var(--accent);
      }
      .bar em {
        position: absolute;
        bottom: -22px;
        left: 50%;
        transform: translateX(-50%);
        font-style: normal;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .tip {
        position: absolute;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        pointer-events: none;
        white-space: nowrap;
        transform: translate(-50%, -110%);
        z-index: 2;
      }
      .tip div::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--bar);
        margin-right: 6px;
      }
      .tip div.a::before {
        background: var(--accent);
      }

      /* roster list */
      .list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 320px;
        overflow-y: auto;
      }
      .li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
        border-radius: 12px;
        cursor: pointer;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
        width: 100%;
      }
      .li:hover {
        background: var(--chip);
      }
      .li[aria-selected="true"] {
        background: var(--chip);
      }
      .av {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 600;
        flex: none;
        font-size: 13px;
      }
      .li small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }
      .li .end {
        margin-left: auto;
        text-align: right;
        font-weight: 500;
      }
      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: middle;
      }

      /* today timeline */
      .tl {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 360px;
        overflow-y: auto;
      }
      .tli {
        display: grid;
        grid-template-columns: 52px 10px 1fr;
        gap: 10px;
        align-items: start;
        padding: 6px 0;
      }
      .tli time {
        color: var(--muted);
        font-size: 12px;
        padding-top: 2px;
      }
      .tli .d {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 5px;
      }
      .tli small {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      /* detail */
      .dhead {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .dhead .av {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        font-size: 16px;
      }
      .dhead .acts {
        margin-left: auto;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 16px 0 12px;
        flex-wrap: wrap;
      }
      .tabs button {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font: inherit;
        padding: 6px 14px;
        border-radius: 99px;
        cursor: pointer;
      }
      .tabs button[aria-selected="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .note {
        background: var(--chip);
        border-radius: 10px;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 12px;
      }
      .body {
        max-height: 380px;
        overflow-y: auto;
      }
      .brief {
        overflow-wrap: anywhere;
      }
      .brief h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      .brief h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 16px 0 6px;
      }
      .brief ul {
        padding-left: 18px;
        margin: 0;
      }
      .brief li {
        margin: 3px 0;
      }
      .brief code {
        background: var(--chip);
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 12px;
      }
      .brief pre {
        background: var(--chip);
        padding: 12px;
        border-radius: 10px;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 9px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
      }
      .st {
        font-weight: 500;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 99px;
        background: var(--chip);
        white-space: nowrap;
      }
      .st.ok {
        color: var(--ok);
      }
      .st.partial,
      .st.skipped {
        color: var(--warn);
      }
      .st.failed,
      .st.blocked {
        color: var(--bad);
      }
      td small {
        color: var(--muted);
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 99px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: calc(100% - 32px);
      }
      .toast.show {
        opacity: 1;
      }
      [hidden] {
        display: none !important;
      }
      .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
      .nav button, .cta { display: inline-flex; align-items: center; gap: 8px; }
      .round .i { width: 18px; height: 18px; }
      .kpi .arrow .i { width: 13px; height: 13px; }
    </style>
  </head>
  <body>
    <!-- Icon sprite, Lucide-style strokes (ISC) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-user-plus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m22 4-10 10.01-3-3"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
    </svg>
    <div class="app">
      <div class="top">
        <div class="logo"><i></i>AgentOps</div>
        <nav class="nav" id="nav" aria-label="Views">
          <button data-v="dashboard" aria-current="page"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg>Dashboard</button>
          <button data-v="team"><svg class="i" aria-hidden="true"><use href="#i-users"/></svg>Team</button>
          <button data-v="schedule"><svg class="i" aria-hidden="true"><use href="#i-calendar"/></svg>Schedule</button>
          <button data-v="runs"><svg class="i" aria-hidden="true"><use href="#i-file"/></svg>Run log</button>
        </nav>
        <div class="tools">
          <button
            class="round"
            data-theme-btn="light"
            title="Light mode"
            aria-label="Light mode"
          >
            <svg class="i" aria-hidden="true"><use href="#i-sun"/></svg>
          </button>
          <button
            class="round"
            data-theme-btn="dark"
            title="Dark mode"
            aria-label="Dark mode"
          >
            <svg class="i" aria-hidden="true"><use href="#i-moon"/></svg>
          </button>
          <span class="me" title="You">ME</span>
        </div>
      </div>

      <div class="welcome">
        <div>
          <h1>Welcome back</h1>
          <p>
            Overview of your AI organization: who is on the team, what runs
            today, and how each employee is doing.
          </p>
        </div>
        <button class="cta" id="hireNext"><svg class="i" aria-hidden="true"><use href="#i-user-plus"/></svg>Hire next employee</button>
      </div>

      <section class="kpis" id="kpis"></section>

      <div id="view-dashboard">
        <div class="row r2">
          <section class="card">
            <div class="chead">
              <div>
                <h3>Weekly Workload</h3>
                <span class="hint"
                  >Scheduled agent minutes per employee, Mon to Fri</span
                >
              </div>
            </div>
            <div class="big" id="bigNum"></div>
            <div class="chart">
              <div class="yax" id="yax"></div>
              <div class="plot" id="plot"></div>
            </div>
          </section>
          <section class="card">
            <div class="chead">
              <h3>Team Roster</h3>
              <span class="hint" id="rosterHint"></span>
            </div>
            <div class="list" id="roster"></div>
          </section>
        </div>
        <div class="row r3">
          <section class="card">
            <div class="chead">
              <div>
                <h3>Today's Shift</h3>
                <span class="hint" id="todayHint"></span>
              </div>
            </div>
            <div class="tl" id="today"></div>
          </section>
          <section class="card" id="detail"></section>
        </div>
      </div>

      <section class="card row" id="view-team" hidden>
        <div class="list" id="teamList" style="max-height: none"></div>
      </section>
      <section class="card row" id="view-schedule" hidden>
        <div class="body" id="schedAll" style="max-height: none"></div>
      </section>
      <section class="card row" id="view-runs" hidden>
        <div class="body" id="runsAll" style="max-height: none"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>

    <script>
      const COLORS = [
        "#f5875e",
        "#5b7fa6",
        "#4f9a6c",
        "#9a6bbf",
        "#c99a3a",
        "#3f9c9c",
        "#d0645a",
        "#6b6862",
      ];
      const DAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
      let org = [],
        current = 0,
        tab = "brief",
        view = "dashboard";
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const initials = (n) =>
        n
          .replace(/[^A-Za-z ]/g, " ")
          .split(" ")
          .filter((w) => /^[A-Z]/.test(w))
          .slice(0, 2)
          .map((w) => w[0])
          .join("");
      const mins = (b) => parseInt(b) || 0;
      const statusClass = (s) => (s || "").split("-")[0];
      const avatar = (i, name) =>
        `<span class="av" style="background:${COLORS[i % 8]}">${initials(name)}</span>`;

      // Runs per week for a SCHEDULE.md "days" value; monthly routines count as a quarter.
      function perWeek(days) {
        if (days === "mon-fri") return 5;
        if (/weekday/.test(days)) return 0.25;
        return days.split(",").filter((d) => DAYS.includes(d)).length;
      }
      function runsToday(days, now = new Date()) {
        const dow = now.getDay();
        if (dow === 0 || dow === 6) return false;
        if (days === "mon-fri") return true;
        if (days === "first-weekday" || days === "last-weekday") {
          const wk = [];
          for (let d = 1; d <= 31; d++) {
            const x = new Date(now.getFullYear(), now.getMonth(), d);
            if (x.getMonth() === now.getMonth() && x.getDay() % 6) wk.push(d);
          }
          return (
            now.getDate() === (days === "first-weekday" ? wk[0] : wk.at(-1))
          );
        }
        return days.split(",").includes(DAYS[dow]);
      }

      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3500);
      }

      async function load() {
        org = await (await fetch("/api/org")).json();
        render();
      }

      function render() {
        const hired = org.filter((e) => e.installed).length;
        const routines = org.reduce((n, e) => n + e.schedule.length, 0);
        const runs = org.filter((e) => !e.sample).flatMap((e) => e.runlog); // live runs only, never the kit samples
        const okRate = runs.length
          ? Math.round(
              (100 * runs.filter((r) => r.status === "ok").length) /
                runs.length,
            ) + "%"
          : "—";
        const todayCount = org.reduce(
          (n, e) => n + e.schedule.filter((r) => runsToday(r.days)).length,
          0,
        );
        $("kpis").innerHTML = [
          [
            "hot",
            "users",
            "AI Employees",
            org.length,
            `${hired} hired · ${org.length - hired} ready`,
          ],
          ["", "sliders", "Routines", routines, "across all roles"],
          [
            "",
            "clock",
            "Running Today",
            todayCount,
            new Date().toLocaleDateString(undefined, { weekday: "long" }),
          ],
          [
            "",
            "check",
            "Run Success",
            okRate,
            runs.length ? `${runs.length} live runs` : "no live runs yet",
          ],
        ]
          .map(
            ([
              c,
              ic,
              t,
              v,
              s,
            ]) => `<div class="card kpi ${c}"><div class="t"><span class="ic"><svg class="i" aria-hidden="true"><use href="#i-${ic}"/></svg></span>${t}<span class="arrow"><svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></span></div>
     <div class="v"><b>${v}</b><small>${s}</small></div></div>`,
          )
          .join("");

        $("nav")
          .querySelectorAll("button")
          .forEach((b) =>
            b.setAttribute(
              "aria-current",
              b.dataset.v === view ? "page" : "false",
            ),
          );
        ["dashboard", "team", "schedule", "runs"].forEach(
          (v) => ($("view-" + v).hidden = v !== view),
        );
        const next = org.find((e) => !e.installed);
        $("hireNext").hidden = !next;

        renderChart();
        renderRoster();
        renderToday();
        renderDetail();
        renderViews();
      }

      function renderChart() {
        const data = org.map((e) => ({
          e,
          min: Math.round(
            e.schedule.reduce(
              (n, r) => n + mins(r.budget) * perWeek(r.days),
              0,
            ),
          ),
          n: e.schedule.length,
        }));
        const total = data.reduce((n, d) => n + d.min, 0);
        const top =
          Math.ceil(Math.max(...data.map((d) => d.min)) / 100) * 100 || 100;
        $("bigNum").innerHTML =
          `<b>${total.toLocaleString()}</b><span class="pill">min / week</span><span class="pill good">≈ ${(total / 60).toFixed(1)} h of agent work</span>
    <span class="legend" style="margin-left:auto"><span>Workload</span><span class="a">Selected</span></span>`;
        $("yax").innerHTML = [5, 4, 3, 2, 1, 0]
          .map((k) => `<span>${Math.round((top * k) / 5)}</span>`)
          .join("");
        $("plot").innerHTML = data
          .map(
            (
              d,
              i,
            ) => `<button class="bar ${i === current ? "on" : ""}" data-i="${i}" aria-label="${esc(d.e.name)}: ${d.min} minutes per week">
      <i style="height:${((100 * d.min) / top).toFixed(1)}%"></i><em>${esc(d.e.name.split(/[ /]/)[0])}</em></button>`,
          )
          .join("");
        const plot = $("plot");
        plot.querySelectorAll(".bar").forEach((b) => {
          b.onclick = () => select(+b.dataset.i);
          b.onmouseenter = () => {
            const d = data[+b.dataset.i],
              bar = b.querySelector("i");
            const tip = document.createElement("div");
            tip.className = "tip";
            tip.innerHTML = `${esc(d.e.name)}<div>${d.n} routines</div><div class="a">${d.min} min / week</div>`;
            tip.style.left = b.offsetLeft + b.offsetWidth / 2 + "px";
            tip.style.top = bar.offsetTop + "px";
            plot.appendChild(tip);
            b.onmouseleave = () => tip.remove();
          };
        });
      }

      function renderRoster() {
        $("rosterHint").textContent = `${org.length} roles`;
        $("roster").innerHTML = org
          .map(
            (
              e,
              i,
            ) => `<button class="li" data-i="${i}" aria-selected="${i === current}">${avatar(i, e.name)}
      <span><b style="font-weight:500">${esc(e.name)}</b><small>${esc(e.role)}</small></span>
      <span class="end"><small><span class="dot" style="background:${e.installed ? "var(--ok)" : "var(--bar)"}"></span>${e.installed ? "Hired" : "Ready"}</small>${e.schedule.length} routines</span></button>`,
          )
          .join("");
        $("roster")
          .querySelectorAll(".li")
          .forEach((b) => (b.onclick = () => select(+b.dataset.i)));
      }

      function renderToday() {
        const items = org
          .flatMap((e, i) =>
            e.schedule
              .filter((r) => runsToday(r.days))
              .map((r) => ({ ...r, e, i })),
          )
          .sort((a, b) => a.fire.localeCompare(b.fire));
        const hhmm = new Date().toTimeString().slice(0, 5);
        $("todayHint").textContent = items.length
          ? `${items.length} routines fire today`
          : "Weekend: nothing scheduled";
        $("today").innerHTML =
          items
            .map(
              (
                r,
              ) => `<div class="tli" style="${r.fire < hhmm ? "opacity:.55" : ""}"><time>${r.fire}</time><span class="d" style="background:${COLORS[r.i % 8]}"></span>
      <span>${esc(r.routine)}<small>${esc(r.e.name)} · ${esc(r.budget)}${r.e.installed ? "" : " · not hired"}</small></span></div>`,
            )
            .join("") || '<p class="hint">Routines run on weekdays.</p>';
      }

      function renderDetail() {
        const e = org[current];
        const tabs = [
          ["brief", "Morning brief"],
          ["schedule", "Schedule"],
          ["runs", "Run log"],
        ];
        $("detail").innerHTML = `
    <div class="dhead">${avatar(current, e.name)}
      <div><h3>${esc(e.name)}</h3><span class="hint">${esc(e.role)} · v${esc(e.version)}</span></div>
      <div class="acts">
        ${e.hasDashboard ? `<a class="cta ghost" style="text-decoration:none" href="/dashboard/${e.slug}" target="_blank">Open dashboard</a>` : ""}
        <button class="cta" id="hire">${e.installed ? "Open in Claude" : "Hire & start"}</button>
      </div></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-t="${k}">${l}</button>`).join("")}</div>
    ${e.sample ? '<div class="note">Sample output from the kit (fictional business). Live briefs and runs appear here once this employee is hired.</div>' : ""}
    <div class="body">${tab === "brief" ? `<div class="brief">${marked.parse(esc(e.brief))}</div>` : tab === "schedule" ? scheduleTable([e]) : runsTable([e])}</div>`;
        $("detail")
          .querySelectorAll("[data-t]")
          .forEach(
            (b) =>
              (b.onclick = () => {
                tab = b.dataset.t;
                renderDetail();
              }),
          );
        $("hire").onclick = () => hire(e, $("hire"));
      }

      function scheduleTable(list) {
        return `<table><tr>${list.length > 1 ? "<th>Employee</th>" : ""}<th>Routine</th><th>Days</th><th>Fires</th><th>Budget</th><th>Browser</th></tr>
    ${list.flatMap((e) => e.schedule.map((r) => `<tr>${list.length > 1 ? `<td>${esc(e.name)}</td>` : ""}<td>${esc(r.routine)}</td><td>${esc(r.days)}</td><td>${esc(r.fire)}</td><td>${esc(r.budget)}</td><td>${esc(r.browser)}</td></tr>`)).join("")}</table>`;
      }
      function runsTable(list) {
        const rows = list
          .flatMap((e) => e.runlog.map((r) => ({ ...r, who: e.name })))
          .sort((a, b) => String(b.start).localeCompare(String(a.start)));
        if (!rows.length) return '<p class="hint">No runs yet.</p>';
        return `<table><tr><th>When</th>${list.length > 1 ? "<th>Employee</th>" : ""}<th>Routine</th><th>Status</th><th>Output / notes</th></tr>
    ${rows
      .map(
        (
          r,
        ) => `<tr><td><small>${esc(String(r.start).replace("T", " ").slice(0, 16))}</small></td>${list.length > 1 ? `<td>${esc(r.who)}</td>` : ""}<td>${esc(r.routine)}</td>
      <td><span class="st ${statusClass(r.status)}">${esc(r.status)}</span></td>
      <td>${(r.outputs || []).map(esc).join("<br>")}${r.notes ? `<br><small>${esc(r.notes)}</small>` : ""}</td></tr>`,
      )
      .join("")}</table>`;
      }

      function renderViews() {
        if (view === "team") {
          $("teamList").innerHTML = org
            .map(
              (e, i) => `<button class="li" data-i="${i}">${avatar(i, e.name)}
      <span><b style="font-weight:500">${esc(e.name)}</b><small>${esc(e.role)} · v${esc(e.version)}</small></span>
      <span class="end"><small><span class="dot" style="background:${e.installed ? "var(--ok)" : "var(--bar)"}"></span>${e.installed ? "Hired" : "Ready to hire"}</small>${e.schedule.length} routines</span></button>`,
            )
            .join("");
          $("teamList")
            .querySelectorAll(".li")
            .forEach(
              (b) =>
                (b.onclick = () => {
                  view = "dashboard";
                  select(+b.dataset.i);
                }),
            );
        }
        if (view === "schedule") $("schedAll").innerHTML = scheduleTable(org);
        if (view === "runs")
          $("runsAll").innerHTML =
            (org.some((e) => e.sample)
              ? '<div class="note">Includes sample runs for employees not hired yet.</div>'
              : "") + runsTable(org);
      }

      function select(i) {
        current = i;
        render();
      }

      async function hire(e, btn) {
        btn.disabled = true;
        const r = await fetch(`/api/hire/${e.slug}`, { method: "POST" });
        toast(
          r.ok
            ? `Terminal opened: Claude is starting the ${e.name}.`
            : "Could not open Terminal: " + (await r.json()).error,
        );
        btn.disabled = false;
      }

      $("nav")
        .querySelectorAll("button")
        .forEach(
          (b) =>
            (b.onclick = () => {
              view = b.dataset.v;
              render();
            }),
        );
      $("hireNext").onclick = () => {
        const i = org.findIndex((e) => !e.installed);
        if (i >= 0) {
          select(i);
          hire(org[i], $("hireNext"));
        }
      };

      function setTheme(t) {
        document.documentElement.dataset.theme = t;
        try {
          localStorage.setItem("theme", t);
        } catch {}
        document
          .querySelectorAll("[data-theme-btn]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", b.dataset.themeBtn === t),
          );
      }
      document
        .querySelectorAll("[data-theme-btn]")
        .forEach((b) => (b.onclick = () => setTheme(b.dataset.themeBtn)));
      let saved;
      try {
        saved = localStorage.getItem("theme");
      } catch {}
      setTheme(
        saved ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"),
      );

      load();
      setInterval(load, 15000); // pick up new briefs and runs while employees work
    </script>
  </body>
</html>
